[project]
name = "openlinkhubclient"
version = "0.1.0"
description = "A command-line client for the OpenLinkHub REST API."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0.3",
    "requests>=2.32",
    "rich>=13.9",
]

[project.scripts]
olh = "olh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olh"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "responses>=0.25",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["olh"]
